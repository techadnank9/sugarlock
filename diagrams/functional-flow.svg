<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" font-family="Inter, Arial, sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="560" fill="#ffffff"/>
<text x="340" y="22" text-anchor="middle" font-size="13" fill="#5f5e5a" letter-spacing="1">GIFT LIFECYCLE</text>

<rect x="250" y="34" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="58" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">Sender creates gift</text>
<text x="340" y="76" text-anchor="middle" font-size="12" fill="#185FA5">amount, condition, recipient</text>
<line x1="340" y1="90" x2="340" y2="118" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="250" y="118" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="142" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C">Fund via Stripe</text>
<text x="340" y="160" text-anchor="middle" font-size="12" fill="#185FA5">money moves to escrow</text>
<line x1="340" y1="174" x2="340" y2="202" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="250" y="202" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="340" y="226" text-anchor="middle" font-size="14" font-weight="500" fill="#633806">Gift locked</text>
<text x="340" y="244" text-anchor="middle" font-size="12" fill="#854F0B">recipient sees it waiting</text>
<line x1="340" y1="258" x2="340" y2="286" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="286" width="220" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="310" text-anchor="middle" font-size="14" font-weight="500" fill="#3C3489">Unlock condition check</text>
<text x="340" y="328" text-anchor="middle" font-size="12" fill="#534AB7">time · self · third-party · data</text>

<line x1="230" y1="316" x2="122" y2="316" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="176" y="306" text-anchor="middle" font-size="12" fill="#5f5e5a">not met</text>
<rect x="42" y="288" width="80" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="82" y="312" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Wait</text>
<text x="82" y="330" text-anchor="middle" font-size="12" fill="#5F5E5A">stays locked</text>
<path d="M82 288 L82 230 L250 230" fill="none" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<line x1="340" y1="346" x2="340" y2="378" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="368" y="366" text-anchor="middle" font-size="12" fill="#5f5e5a">met</text>

<rect x="250" y="378" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="402" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Gift unlocks</text>
<text x="340" y="420" text-anchor="middle" font-size="12" fill="#0F6E56">animation + release</text>
<line x1="340" y1="434" x2="340" y2="462" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="250" y="462" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="486" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Funds released</text>
<text x="340" y="504" text-anchor="middle" font-size="12" fill="#0F6E56">recipient withdraws</text>
</svg>
